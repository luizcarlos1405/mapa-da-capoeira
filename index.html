<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa da Capoeira</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div id="aplicativo">
      <aside id="painel" class="fechado">
        <header id="cabecalho-painel">
          <img
            class="icone-berimbau"
            src="berimbau.svg"
            alt="Berimbau"
            height="80"
          />
          <div class="titulo-linha">
            <h1>Mapa da Capoeira</h1>
            <p class="subtitulo">Encontre locais de treino perto de você</p>
            <div class="faixa-bandeira">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </header>

        <div id="cabecalho-movel">
          <div class="cabecalho-movel-conteudo">
            <h2>Locais de Treino</h2>
            <span id="contagem-movel" class="selo-contagem">0</span>
            <button class="btn-fechar-painel" onclick="fecharPainel()">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="container-busca">
          <div id="campo-busca">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input
              type="text"
              id="entrada-busca"
              placeholder="Buscar por nome, grupo ou responsável..."
              oninput="filtrarLocais()"
            />
          </div>
          <div id="abas-filtro">
            <button
              class="aba ativa"
              onclick="definirFiltro(this, 'todos')"
            >
              Todos
            </button>
            <button class="aba" onclick="definirFiltro(this, 'nome')">
              Nome
            </button>
            <button class="aba" onclick="definirFiltro(this, 'grupo')">
              Grupo
            </button>
            <button
              class="aba"
              onclick="definirFiltro(this, 'responsavel')"
            >
              Responsável
            </button>
          </div>
        </div>

        <div id="lista-locais">
          <p id="contagem-resultados"></p>
        </div>

        <footer id="rodape-painel">
          Dados de domínio público · OpenStreetMap
        </footer>
      </aside>

      <main id="area-mapa">
        <div id="mapa"></div>
        <div id="busca-movel">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            type="text"
            id="entrada-busca-movel"
            placeholder="Buscar local de treino..."
            oninput="filtrarLocaisMovel()"
          />
          <button id="btn-abrir-painel" onclick="abrirPainel()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="4" x2="20" y1="12" y2="12"></line>
              <line x1="4" x2="20" y1="6" y2="6"></line>
              <line x1="4" x2="20" y1="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </main>
    </div>

    <div id="carregando">
      <div class="spinner"></div>
    </div>

    <noscript>
      <h1>Mapa da Capoeira — Dourados, MS</h1>
      <p>
        Encontre locais de treino de capoeira em Dourados, Mato Grosso do Sul.
        Mapa interativo com endereços, horários de treino, telefones de contato e
        grupos de capoeira da cidade e região.
      </p>
      <h2>Grupos de Capoeira em Dourados</h2>
      <p>
        Consulte nosso mapa para encontrar aulas de capoeira, rodas e treinos em
        Dourados, MS. O Mapa da Capoeira reúne informações sobre grupos, mestres,
        horários e locais de prática em toda a cidade.
      </p>
      <h2>Como encontrar treino de capoeira</h2>
      <p>
        Use o mapa para buscar por nome do grupo, nome do responsável ou endereço.
        Cada marcador mostra o horário de treino, telefone e Instagram do grupo.
        Capoeira em Dourados — venha treinar!
      </p>
    </noscript>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="mapa.js"></script>
  </body>
</html>
